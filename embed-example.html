<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>预览卡片接入示例 | LitematicWebViewer</title>
  <link rel="icon" type="image/svg+xml" href="./brand/icon.svg">
  <style>
    * { box-sizing: border-box } body { margin:0; background:#111d2b; color:#e0eaf7; font:15px/1.8 system-ui,sans-serif }
    main { max-width:1100px; margin:48px auto; padding:0 24px } a { color:#87cbff } h1 { font-size:28px } p { color:#acc0d7 }
    .cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; margin:28px 0 }
    article { background:#1a2b40; border:1px solid #344b65; border-radius:14px; overflow:hidden } article h2,article p { margin:12px 20px }
    h2 { font-size:18px }.preview { height:300px; background:#172332 } iframe { width:100%;height:100%;border:0 }
    button,input { font:inherit; max-width:100% } button { padding:6px 12px; border:1px solid #647e9d; border-radius:6px; color:inherit; background:#284568; cursor:pointer }
    .actions { padding:0 20px 20px; display:flex;flex-wrap:wrap;gap:12px;align-items:center }
    @media(max-width:700px) { .cards { grid-template-columns:1fr } main { margin:24px auto } }
  </style>
</head>
<body>
  <main>
    <a href="./" id="back">← 完整预览器</a>
    <h1 id="heading">把投影放进你的档案馆</h1>
    <p id="intro">拖动卡片内的建筑旋转视角，单击进入完整预览。下面分别演示文件链接和文件数据两种接入方式。</p>
    <div class="cards">
      <article><div id="urlCard" class="preview"></div><h2 id="urlTitle">公开文件链接</h2><p id="urlText">一段 iframe 即可接入，示例使用原版材质。</p></article>
      <article><div id="fileCard" class="preview"></div><h2 id="fileTitle">本地或受保护的文件</h2><p id="fileText">文件在浏览器中传递；进入完整预览也不需要上传。</p><div class="actions"><button id="sample">使用示例</button><input id="file" type="file" accept=".litematic,.litematica,.nbt" aria-label="选择投影文件"></div></article>
    </div>
    <p><a id="docs" href="https://github.com/Gudu-Z/LitematicWebViewer#嵌入预览卡片">查看 README 接入文档 ↗</a></p>
  </main>
  <script type="module" src="./src/embedExample.js"></script>
</body>
</html>
